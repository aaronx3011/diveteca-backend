services:
  backend:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./data:/app/data
      - ./wg0.conf:/etc/wireguard/wg0.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: ../diveteca-crm-frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
